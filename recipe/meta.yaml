{% set name = "snowexsql" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/snowexsql-{{ version }}.tar.gz
  sha256: 12f7c2f4d73bf6b0487152bf04f0d308db9d4e369c01c6b778534dcf73fde511

build:
  entry_points:
    - clear_dataset=snowexsql.cli:clear_dataset
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - utm >=0.5.0,<1.0
    - geoalchemy2 >=0.6,<1.0
    - geopandas >=0.7,<2.0
    - psycopg2-binary >=2.9.0,<2.10.0
    - rasterio >=1.1.5
    - sqlalchemy >=2.0.0

test:
  imports:
    - snowexsql
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/SnowEx/snowexsql
  summary: SQL Database software for SnowEx data
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  description: |
    Database access and tools for using the SnowEx database.
    This tool is simply a client for accessing the database using python.
  doc_url: https://snowexsql.readthedocs.io

extra:
  recipe-maintainers:
    - micah-prime
